version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: war_postgres
    environment:
      POSTGRES_DB: war_game
      POSTGRES_USER: war_user
      POSTGRES_PASSWORD: war_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: war_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile.dev
    container_name: war_server
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate --workspace @war/server && npm run start:dev --workspace @war/server"
    env_file:
      - .env
    ports:
      - '3001:3001'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: war_web
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace @war/web"
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
